<!doctype html><meta charset="utf-8"><title>worker release</title><body><h1 id="h">worker release</h1><script>
const q = new URLSearchParams(location.search), mode = q.get('mode'), run = q.get('run'), dbName = 'lab-' + run;
const log = (ev, data = {}) => fetch('/log', { method: 'POST', body: JSON.stringify({ run, mode, page: 'd', ev, ...data, ms: Math.round(performance.now()) }), keepalive: true }).catch(() => {});
log('load', { ua: navigator.userAgent });
const open = indexedDB.open(dbName);
open.onsuccess = () => {
  const db = open.result; // stays open the whole time: the page never steps aside
  db.onversionchange = () => log('own-versionchange-ignored');
  log('open', { version: db.version });
  const t1 = performance.now();
  const tx = db.transaction('s', 'readwrite'); tx.objectStore('s').put('stuck', 'kd');
  tx.oncomplete = () => log('stuck-write-complete', { took: Math.round(performance.now() - t1) });
  setTimeout(() => {
    const worker = new Worker('bump-worker.js');
    worker.onmessage = event => log('worker', { says: event.data });
    worker.postMessage({ name: dbName, version: db.version + 1 });
    log('worker-asked', { version: db.version + 1 });
    setTimeout(() => {
      worker.terminate();
      log('worker-terminated');
      // Nothing must be left queued: a fresh open, a write on the old connection, and the version.
      const t2 = performance.now();
      const fresh = indexedDB.open(dbName);
      fresh.onblocked = () => log('fresh-blocked');
      fresh.onsuccess = () => {
        log('fresh-open', { took: Math.round(performance.now() - t2), version: fresh.result.version });
        const t3 = performance.now();
        const tx2 = fresh.result.transaction('s', 'readwrite'); tx2.objectStore('s').put('after', 'kd2');
        tx2.oncomplete = () => log('fresh-write-complete', { took: Math.round(performance.now() - t3) });
      };
      const t4 = performance.now();
      const tx3 = db.transaction('s', 'readwrite'); tx3.objectStore('s').put('old-conn', 'kd3');
      tx3.oncomplete = () => log('old-conn-write-complete', { took: Math.round(performance.now() - t4) });
    }, 1500);
  }, 3000);
};
</script>
