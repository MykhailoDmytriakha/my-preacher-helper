<!doctype html><meta charset="utf-8"><title>old tab</title><body><h1>old tab (idle connection, ignores version changes)</h1><script>
const q = new URLSearchParams(location.search), run = q.get('run'), dbName = 'lab-' + run;
const log = (ev, data = {}) => fetch('/log', { method: 'POST', body: JSON.stringify({ run, page: 'e', ev, ...data, ms: Math.round(performance.now()) }), keepalive: true }).catch(() => {});
const open = indexedDB.open(dbName, 1);
open.onupgradeneeded = () => open.result.createObjectStore('s');
open.onsuccess = () => { window.__db = open.result; log('idle-holder-open', { version: open.result.version }); };
</script>
